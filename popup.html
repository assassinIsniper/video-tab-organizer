<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         width: 236px; padding: 12px; margin: 0; color: #222; }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  label { display: block; margin: 6px 0; cursor: pointer; }
  fieldset { border: 1px solid #e0e0e0; border-radius: 8px; padding: 6px 10px; margin: 10px 0; }
  legend { font-size: 12px; color: #777; padding: 0 4px; }
  button { width: 100%; padding: 7px; margin-top: 4px; cursor: pointer;
           border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; }
  button:hover { background: #eee; }
  #status { color: #0a8; font-size: 12px; height: 16px; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1>视频标签页整理</h1>

  <label><input type="checkbox" id="enabled"> 启用自动整理</label>

  <fieldset>
    <legend>右侧视频标签页排序</legend>
    <label><input type="radio" name="order" value="asc"> 早打开的靠左</label>
    <label><input type="radio" name="order" value="desc"> 晚打开的靠左</label>
  </fieldset>

  <button id="now">立即整理一次</button>
  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
